<text x="182" y="168" font-size="12" font-weight="400" fill="#7A6F64" text-anchor="middle">React Native · Expo SDK 57 · Expo Router</text>
<rect x="52" y="190" width="260" height="62" rx="16" fill="#F3EEE4"/>
<text x="182.0" y="216.0" font-size="13" font-weight="700" fill="#2B2118" text-anchor="middle">Screens (src/app)</text>
<text x="182.0" y="233.0" font-size="12" font-weight="400" fill="#7A6F64" text-anchor="middle">prices · market · chats · dashboard</text>
