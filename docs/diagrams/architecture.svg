<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="KisanMandi architecture">
<title>KisanMandi architecture</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B2118"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3F7A3F"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C4483A"/></marker></defs>
<rect width="1100" height="640" rx="24" fill="#F3EEE4"/>
<text x="32" y="46" font-size="24" font-weight="800" fill="#2B2118" text-anchor="start">How KisanMandi fits together</text>
<text x="32" y="72" font-size="14" font-weight="400" fill="#7A6F64" text-anchor="start">One Expo app, one Convex backend, a few outside services</text>
